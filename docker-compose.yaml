services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safelaunch
    ports:
      - "8081:8080"
    environment:
      - ENV=production
      # Required: the server refuses to start unauthenticated outside development.
      # Set it in a .env file next to this one, or export it before `docker compose up`.
      - SAFELAUNCH_API_KEY=${SAFELAUNCH_API_KEY:?set SAFELAUNCH_API_KEY to a long random string}
      - PORT=8080
      - DB_PATH=/app/db/feature_flags.db
    volumes:
      # Maps host folder './db' to container folder '/app/db'
      - ./db:/app/db
    restart: unless-stopped